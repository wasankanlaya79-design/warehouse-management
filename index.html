<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การจัดการคลังสินค้า – สต็อก รับเข้า จ่ายออก และรายงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2530; --muted:#5d6b79; --line:#dde3e9;
  --side:#1f2e3d; --side-ink:#c9d4de; --side-hi:#0e7f7a; --side-bar:#48d6c6;
  --teal:#0e7f7a; --teal-soft:#dff2f0; --red:#c2412d; --red-soft:#fbe7e3;
  --amber:#a86a00; --amber-soft:#fdf0d6; --green:#237a3b; --green-soft:#e2f3e6;
  --radius:10px;
  font-family:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI','Sukhumvit Set',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --panel:#1a222c; --ink:#e3e9ef; --muted:#93a2b1; --line:#2b3642;
    --side:#0f161e; --teal-soft:#123a38; --red-soft:#3d1f1a; --amber-soft:#3a2d12; --green-soft:#16301d;
    --teal:#3cc2b4; --red:#ef7a66; --amber:#e3a93c; --green:#63c77d;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1a222c; --ink:#e3e9ef; --muted:#93a2b1; --line:#2b3642;
  --side:#0f161e; --teal-soft:#123a38; --red-soft:#3d1f1a; --amber-soft:#3a2d12; --green-soft:#16301d;
  --teal:#3cc2b4; --red:#ef7a66; --amber:#e3a93c; --green:#63c77d;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* sidebar */
.side{position:fixed;top:0;bottom:0;left:0;width:250px;background:var(--side);color:var(--side-ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;z-index:40;transition:transform .22s ease}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--side-hi);display:grid;place-items:center;color:#fff;font-weight:700}
.brand b{display:block;color:#fff;font-size:16px;line-height:1.2}
.brand small{font-size:12px;opacity:.7}
.nav{flex:1;overflow-y:auto;padding:10px 0}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:12px 22px;cursor:pointer;font-size:15.5px;border-left:4px solid transparent}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--side-hi);color:#fff;border-left-color:var(--side-bar)}
.nav button:focus-visible{outline:2px solid var(--side-bar);outline-offset:-2px}
.nav .sep{height:1px;background:rgba(255,255,255,.07);margin:8px 0}
.side-foot{padding:14px 22px;font-size:12px;opacity:.65;border-top:1px solid rgba(255,255,255,.07)}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:35;display:none}

/* main */
.main{margin-left:250px;min-height:100%}
.topbar{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--teal);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:7px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn.del:hover{color:var(--red)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.panel>h3{margin:0;padding:16px 18px 0;font-size:16px}
.panel .pad{padding:16px 18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-top:3px solid var(--c,var(--teal))}
.stat span{color:var(--muted);font-size:13.5px}
.stat b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat small{color:var(--muted);font-size:12.5px}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.dash .full{grid-column:1/-1}

.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:16px 18px 10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar i{display:block;width:100%;max-width:54px;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:3px}
.bar.cur i{background:var(--side-bar)}
.bar em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar small{font-size:12.5px;color:var(--muted)}

/* tables */
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 14px;background:color-mix(in srgb,var(--teal) 7%,var(--panel));border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--teal) 4%,transparent)}
td.act{white-space:nowrap;text-align:right;width:1%}
.code{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.link{border:0;background:none;padding:0;color:var(--teal);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.tag{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.part{background:var(--amber-soft);color:var(--amber)}
.tag.no{background:var(--red-soft);color:var(--red)}
.low{color:var(--red);font-weight:600}
.section-gap{margin-top:18px}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rep .full{grid-column:1/-1}
.sumrow td{font-weight:700;background:var(--bg)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto}
.modal-back[hidden]{display:none}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h2{margin:0;font-size:18px}
.m-body{padding:18px 20px;display:grid;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
label.f{display:grid;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.lines input,.lines select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--teal) 55%,transparent);border-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:1fr 80px 110px 100px 34px;gap:8px;align-items:center}
.line .lt{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.line-h{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.doc-total{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;font-size:15px;padding-top:6px;border-top:1px dashed var(--line)}
.doc-total b{font-size:22px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.err{color:var(--red);font-size:13.5px;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:9px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .dash,.rep{grid-template-columns:1fr}
}
@media (max-width:900px){
  .side{transform:translateX(-100%);width:280px}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block}
  .main{margin-left:0}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar b{font-size:16px}
  .wrap{padding:20px 14px 50px}
  .head h1{font-size:24px}
  .line{grid-template-columns:1fr 64px 90px 30px}
  .line .lt{display:none}
  .line-h{display:none}
}
@media (max-width:520px){ .grid2{grid-template-columns:1fr} .stat b{font-size:20px} }
@media (prefers-reduced-motion:reduce){ .side,.toast{transition:none} }
</style>
</head>
<body>
<aside class="side" id="side" aria-label="เมนูหลัก">
  <div class="brand"><div class="logo" id="logoChar">ค</div><div><b id="shopName">คลังสินค้าของฉัน</b><small>การจัดการคลังสินค้า</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="syncNote">ข้อมูลบันทึกในเครื่องนี้</div>
</aside>
<div class="scrim" data-act="close-menu"></div>

<div class="main">
  <div class="topbar">
    <button class="icon-btn" data-act="open-menu" aria-label="เปิดเมนู"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <b id="topTitle">แผงควบคุม</b>
  </div>
  <main class="wrap" id="view"></main>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2><button class="icon-btn" data-act="close" aria-label="ปิด"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
    <div class="m-body" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (+n || 0).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
const int = n => (+n || 0).toLocaleString('th-TH');
const uid = () => Math.random().toString(36).slice(2, 10);
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function localToday(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const thDate = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return `${+d} ${TH_M[+m-1]} ${String(+y+543).slice(2)}`; };
const monthKey = s => s.slice(0,7);
const thMonth = k => { const [y,m] = k.split('-'); return `${TH_M[+m-1]} ${String(+y+543).slice(2)}`; };
function nextNo(prefix, list, pad=4){ let max = 0; list.forEach(x => { const n = parseInt(String(x.no||x.code).replace(/\D/g,'')) || 0; if(n > max) max = n; }); return prefix + String(max+1).padStart(pad,'0'); }

const IC = {
  dashboard:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  stock:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  suppliers:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 9.38A1 1 0 0 0 17.52 9H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  customers:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  purchases:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  sales:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/>',
  receipts:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  payments:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  reports:'<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- state & storage ---------- */
const emptyState = () => ({shop:'คลังสินค้าของฉัน', products:[], suppliers:[], customers:[], purchases:[], sales:[], receipts:[], payments:[]});
let S = emptyState();
let DB = null, saveTimer = null;
const LS_KEY = 'shop-app-state-v1';
try { const raw = localStorage.getItem(LS_KEY); if(raw) S = Object.assign(emptyState(), JSON.parse(raw)); } catch(e){}

function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  if(DB){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await DB.doc('store/main').set({state: JSON.stringify(S), updatedAt: Date.now()}); }
      catch(e){ if(e && e.code === 'unavailable'){ setTimeout(save, 1500 + Math.random()*1000); } else toast('บันทึกขึ้นระบบไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้'); }
    }, 500);
  }
}
async function connectDB(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db');
    if(!db) return;
    DB = db;
    const snap = await db.doc('store/main').get();
    if(snap.exists){
      const d = snap.data();
      S = Object.assign(emptyState(), JSON.parse(d.state));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
      render();
    } else if(S.products.length || S.customers.length){ save(); }
    $('#syncNote').textContent = 'ข้อมูลซิงก์กับบัญชีคุณแล้ว';
  }catch(e){ DB = null; }
}

/* ---------- derived ---------- */
const byId = (list, id) => list.find(x => x.id === id);
const docTotal = d => d.items.reduce((a,i) => a + i.qty * i.price, 0);
const salePaid = s => S.receipts.filter(r => r.saleId === s.id).reduce((a,r) => a + r.amount, 0);
const purPaid = p => S.payments.filter(r => r.purchaseId === p.id).reduce((a,r) => a + r.amount, 0);
const saleDue = s => Math.max(0, docTotal(s) - salePaid(s));
const purDue = p => Math.max(0, docTotal(p) - purPaid(p));
const custDue = c => S.sales.filter(s => s.customerId === c.id).reduce((a,s) => a + saleDue(s), 0);
const supDue = c => S.purchases.filter(p => p.supplierId === c.id).reduce((a,p) => a + purDue(p), 0);
function payTag(total, paid){
  if(paid >= total - 0.001) return '<span class="tag ok">ชำระครบ</span>';
  if(paid > 0) return '<span class="tag part">ค้างบางส่วน</span>';
  return '<span class="tag no">ยังไม่ชำระ</span>';
}
const sortDesc = list => [...list].sort((a,b) => (b.date + b.no).localeCompare(a.date + a.no));

/* ---------- navigation ---------- */
const MENU = [
  ['dashboard','แผงควบคุม','ภาพรวมของร้าน ยอดขาย และสิ่งที่ต้องตามต่อ'],
  ['stock','สต็อกสินค้า','ดูของคงเหลือ ราคาทุน ราคาขาย'],
  ['suppliers','ผู้ผลิต','รายชื่อผู้ผลิตและยอดที่เรายังค้างจ่าย'],
  ['customers','ลูกค้า','รายชื่อลูกค้าและยอดที่ยังค้างชำระ'],
  ['purchases','จัดซื้อ','ซื้อของเข้าร้าน สต็อกจะเพิ่มให้เอง'],
  ['sales','ขายสินค้า','ออกบิลขาย สต็อกจะตัดให้เอง'],
  ['receipts','รับชำระเงิน','เก็บเงินจากบิลขายที่ยังค้างอยู่'],
  ['payments','จ่ายเงินเจ้าหนี้','จ่ายเงินค่าของให้ผู้ผลิต'],
  ['reports','รายงาน','สรุปยอดขาย กำไร และยอดค้างรับ-ค้างจ่าย'],
  ['settings','ตั้งค่า','ชื่อร้าน และจัดการข้อมูล']
];
let current = 'dashboard';
const Q = {};
function renderNav(){
  $('#nav').innerHTML = MENU.map(([k,t],i) => (k==='settings'?'<div class="sep"></div>':'') +
    `<button data-act="nav" data-k="${k}" class="${k===current?'on':''}" ${k===current?'aria-current="page"':''}>${icon(k)}<span>${t}</span></button>`).join('');
  $('#shopName').textContent = S.shop || 'คลังสินค้าของฉัน';
  $('#logoChar').textContent = (S.shop || 'ค').trim().charAt(0) || 'ค';
}
function head(k, actions=''){
  const m = MENU.find(x => x[0]===k);
  return `<div class="head"><div><h1>${m[1]}</h1><p>${m[2]}</p></div><div class="actions">${actions}</div></div>`;
}
function render(){
  renderNav();
  $('#topTitle').textContent = MENU.find(x => x[0]===current)[1];
  document.title = MENU.find(x => x[0]===current)[1] + ' · ' + (S.shop||'คลังสินค้าของฉัน');
  $('#view').innerHTML = VIEWS[current]();
}

/* ---------- table helper ---------- */
function tbl(cols, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="tscroll"><table><thead><tr>${cols.map(c => `<th class="${c.c||''}">${c.h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.c||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const searchBox = (k, ph) => `<div class="search">${icon('search')}<input type="search" placeholder="${ph}" data-search="${k}" value="${esc(Q[k]||'')}" aria-label="${ph}"></div>`;
const match = (k, ...fields) => { const q = (Q[k]||'').trim().toLowerCase(); return !q || fields.join(' ').toLowerCase().includes(q); };
const rowBtns = (kind, id) => `<button class="icon-btn" data-act="edit-${kind}" data-id="${id}" aria-label="แก้ไข">${icon('edit')}</button><button class="icon-btn del" data-act="del-${kind}" data-id="${id}" aria-label="ลบ">${icon('trash')}</button>`;
const firstRun = () => `<div class="panel"><div class="empty"><p style="font-size:17px;color:var(--ink);margin:0 0 4px">ยังไม่มีข้อมูลเลย</p>เริ่มจากเพิ่มสินค้าในสต็อก หรือจะลองกดโหลดข้อมูลตัวอย่างมาดูหน้าตาก่อนก็ได้<br><button class="btn" data-act="load-sample">โหลดข้อมูลตัวอย่าง</button> <button class="btn ghost" data-act="nav" data-k="stock">เพิ่มสินค้าเอง</button></div></div>`;

/* ---------- views ---------- */
const VIEWS = {
dashboard(){
  if(!S.products.length && !S.sales.length) return head('dashboard') + firstRun();
  const mk = localToday().slice(0,7);
  const monthSales = S.sales.filter(s => monthKey(s.date) === mk);
  const sum = monthSales.reduce((a,s) => a + docTotal(s), 0);
  const ar = S.sales.reduce((a,s) => a + saleDue(s), 0);
  const ap = S.purchases.reduce((a,p) => a + purDue(p), 0);
  const low = S.products.filter(p => p.qty <= p.min);
  const arCount = S.sales.filter(s => saleDue(s) > 0).length;
  // last 6 months
  const d = new Date(); const months = [];
  for(let i=5;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); months.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  const vals = months.map(m => S.sales.filter(s => monthKey(s.date)===m).reduce((a,s) => a + docTotal(s), 0));
  const max = Math.max(...vals, 1);
  const recent = sortDesc(S.sales).slice(0,6);
  return head('dashboard', `<button class="btn" data-act="new-sale">${icon('plus')}ขายสินค้า</button>`) + `
  <div class="stats">
    <div class="stat"><span>ยอดขายเดือนนี้</span><b>฿${money(sum)}</b><small>${monthSales.length} บิล</small></div>
    <div class="stat" style="--c:var(--amber)"><span>ลูกค้าค้างชำระ</span><b>฿${money(ar)}</b><small>${arCount} บิลรอเก็บเงิน</small></div>
    <div class="stat" style="--c:var(--side)"><span>เราค้างจ่ายผู้ผลิต</span><b>฿${money(ap)}</b><small>${S.purchases.filter(p=>purDue(p)>0).length} ใบสั่งซื้อ</small></div>
    <div class="stat" style="--c:var(--red)"><span>สินค้าใกล้หมด</span><b>${low.length} รายการ</b><small>ต่ำกว่าจุดสั่งซื้อ</small></div>
  </div>
  <div class="dash">
    <div class="panel"><h3>ยอดขาย 6 เดือนล่าสุด</h3>
      <div class="bars">${months.map((m,i) => `<div class="bar ${i===5?'cur':''}"><em>${vals[i] ? (vals[i]>=1000 ? (vals[i]/1000).toFixed(1)+'k' : int(vals[i])) : '–'}</em><i style="height:${Math.round(vals[i]/max*100)}%"></i><small>${thMonth(m)}</small></div>`).join('')}</div>
    </div>
    <div class="panel"><h3>ของใกล้หมด ควรสั่งเพิ่ม</h3>
      ${tbl([{h:'สินค้า',f:p=>esc(p.name)},{h:'เหลือ',c:'num',f:p=>`<span class="low">${int(p.qty)}</span> ${esc(p.unit)}`}], low.slice(0,6), 'สต็อกยังพอ ไม่มีอะไรต้องรีบสั่ง')}
    </div>
    <div class="panel full"><h3>บิลขายล่าสุด</h3>
      ${tbl([
        {h:'เลขที่',f:s=>`<button class="link" data-act="view-sale" data-id="${s.id}">${s.no}</button>`},
        {h:'วันที่',f:s=>thDate(s.date)},
        {h:'ลูกค้า',f:s=>esc(byId(S.customers,s.customerId)?.name||'-')},
        {h:'ยอดรวม',c:'num',f:s=>money(docTotal(s))},
        {h:'สถานะ',f:s=>payTag(docTotal(s),salePaid(s))}
      ], recent, 'ยังไม่มีบิลขาย')}
    </div>
  </div>`;
},
stock(){
  const rows = S.products.filter(p => match('stock', p.code, p.name));
  const value = S.products.reduce((a,p) => a + p.qty*p.cost, 0);
  return head('stock', `<button class="btn" data-act="add-product">${icon('plus')}เพิ่มสินค้า</button>`) + `
  <div class="panel"><div class="toolbar">${searchBox('stock','ค้นหารหัสหรือชื่อสินค้า...')}<span class="hint">มูลค่าสต็อกตามทุน ฿${money(value)}</span></div>
  <div id="list">${tbl([
    {h:'รหัส',f:p=>`<span class="code">${esc(p.code)}</span>`},
    {h:'ชื่อสินค้า',f:p=>esc(p.name)},
    {h:'หน่วย',f:p=>esc(p.unit)},
    {h:'ทุน',c:'num',f:p=>money(p.cost)},
    {h:'ราคาขาย',c:'num',f:p=>money(p.price)},
    {h:'คงเหลือ',c:'num',f:p=>p.qty<=p.min?`<span class="low">${int(p.qty)}</span>`:int(p.qty)},
    {h:'',c:'act',f:p=>rowBtns('product',p.id)}
  ], rows, S.products.length ? 'ไม่เจอสินค้าที่ค้นหา' : 'ยังไม่มีสินค้า กด "เพิ่มสินค้า" ด้านบนได้เลย')}</div></div>`;
},
suppliers(){
  const rows = S.suppliers.filter(p => match('suppliers', p.code, p.name, p.phone));
  return head('suppliers', `<button class="btn" data-act="add-supplier">${icon('plus')}เพิ่มผู้ผลิต</button>`) + `
  <div class="panel"><div class="toolbar">${searchBox('suppliers','ค้นหาชื่อหรือเบอร์โทร...')}</div>
  <div id="list">${tbl([
    {h:'รหัส',f:p=>`<span class="code">${esc(p.code)}</span>`},
    {h:'ชื่อผู้ผลิต',f:p=>esc(p.name)},
    {h:'เบอร์โทร',f:p=>esc(p.phone||'-')},
    {h:'ค้างจ่าย',c:'num',f:p=>{const d=supDue(p);return d?`<b>${money(d)}</b>`:'-'}},
    {h:'',c:'act',f:p=>rowBtns('supplier',p.id)}
  ], rows, S.suppliers.length ? 'ไม่เจอผู้ผลิตที่ค้นหา' : 'ยังไม่มีผู้ผลิต')}</div></div>`;
},
customers(){
  const rows = S.customers.filter(p => match('customers', p.code, p.name, p.phone));
  return head('customers', `<button class="btn" data-act="add-customer">${icon('plus')}เพิ่มลูกค้า</button>`) + `
  <div class="panel"><div class="toolbar">${searchBox('customers','ค้นหาชื่อหรือเบอร์โทร...')}</div>
  <div id="list">${tbl([
    {h:'รหัสลูกค้า',f:p=>`<span class="code">${esc(p.code)}</span>`},
    {h:'ชื่อลูกค้า',f:p=>esc(p.name)},
    {h:'เบอร์โทร',f:p=>esc(p.phone||'-')},
    {h:'ค้างชำระ',c:'num',f:p=>{const d=custDue(p);return d?`<b>${money(d)}</b>`:'-'}},
    {h:'',c:'act',f:p=>rowBtns('customer',p.id)}
  ], rows, S.customers.length ? 'ไม่เจอลูกค้าที่ค้นหา' : 'ยังไม่มีลูกค้า')}</div></div>`;
},
purchases(){ return docList('purchase'); },
sales(){ return docList('sale'); },
receipts(){ return payPage('receipt'); },
payments(){ return payPage('payment'); },
reports(){
  const months = [...new Set([...S.sales,...S.purchases].map(x => monthKey(x.date)))].sort().reverse();
  const sel = Q.repMonth ?? (months[0] || '');
  const inM = x => !sel || monthKey(x.date) === sel;
  const sales = S.sales.filter(inM);
  const byProd = {};
  sales.forEach(s => s.items.forEach(i => {
    const p = byId(S.products, i.productId); const k = i.productId;
    byProd[k] = byProd[k] || {name: p?.name || '(ลบแล้ว)', qty:0, rev:0, cost:0};
    byProd[k].qty += i.qty; byProd[k].rev += i.qty*i.price; byProd[k].cost += i.qty*(i.cost ?? p?.cost ?? 0);
  }));
  const prodRows = Object.values(byProd).sort((a,b) => b.rev - a.rev);
  const tot = prodRows.reduce((a,r) => ({qty:a.qty+r.qty, rev:a.rev+r.rev, cost:a.cost+r.cost}), {qty:0,rev:0,cost:0});
  const byCust = {};
  sales.forEach(s => { byCust[s.customerId] = (byCust[s.customerId]||0) + docTotal(s); });
  const custRows = Object.entries(byCust).map(([id,v]) => ({name: byId(S.customers,id)?.name || '-', v})).sort((a,b) => b.v - a.v).slice(0,8);
  const arRows = S.customers.map(c => ({c, d: custDue(c)})).filter(x => x.d > 0).sort((a,b) => b.d - a.d);
  const apRows = S.suppliers.map(c => ({c, d: supDue(c)})).filter(x => x.d > 0).sort((a,b) => b.d - a.d);
  const prodTable = prodRows.length ? `<div class="tscroll"><table><thead><tr><th>สินค้า</th><th class="num">จำนวน</th><th class="num">ยอดขาย</th><th class="num">ทุน</th><th class="num">กำไร</th></tr></thead><tbody>
    ${prodRows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${int(r.qty)}</td><td class="num">${money(r.rev)}</td><td class="num">${money(r.cost)}</td><td class="num">${money(r.rev-r.cost)}</td></tr>`).join('')}
    <tr class="sumrow"><td>รวม</td><td class="num">${int(tot.qty)}</td><td class="num">${money(tot.rev)}</td><td class="num">${money(tot.cost)}</td><td class="num">${money(tot.rev-tot.cost)}</td></tr></tbody></table></div>` : '<div class="empty">ช่วงนี้ยังไม่มียอดขาย</div>';
  return head('reports', `<label class="f" style="min-width:180px">เดือน<select data-rep="month"><option value="">ทั้งหมด</option>${months.map(m => `<option value="${m}" ${m===sel?'selected':''}>${thMonth(m)}</option>`).join('')}</select></label>`) + `
  <div class="rep">
    <div class="panel full"><h3>ยอดขายและกำไรแยกตามสินค้า</h3><div class="pad" style="padding-top:10px">${prodTable}</div></div>
    <div class="panel"><h3>ลูกค้าที่ซื้อเยอะสุด</h3><div class="pad" style="padding-top:10px">${tbl([{h:'ลูกค้า',f:r=>esc(r.name)},{h:'ยอดซื้อ',c:'num',f:r=>money(r.v)}], custRows, 'ยังไม่มีข้อมูล')}</div></div>
    <div class="panel"><h3>ยอดค้างรับ (ลูกค้า)</h3><div class="pad" style="padding-top:10px">${tbl([{h:'ลูกค้า',f:r=>esc(r.c.name)},{h:'ค้างชำระ',c:'num',f:r=>money(r.d)}], arRows, 'ไม่มีใครค้างเลย')}</div></div>
    <div class="panel"><h3>ยอดค้างจ่าย (ผู้ผลิต)</h3><div class="pad" style="padding-top:10px">${tbl([{h:'ผู้ผลิต',f:r=>esc(r.c.name)},{h:'ค้างจ่าย',c:'num',f:r=>money(r.d)}], apRows, 'จ่ายครบหมดแล้ว')}</div></div>
  </div>`;
},
settings(){
  return head('settings') + `
  <div class="panel" style="max-width:620px"><div class="pad" style="display:grid;gap:14px">
    <label class="f">ชื่อร้าน<input id="setShop" value="${esc(S.shop)}" maxlength="60"></label>
    <div><button class="btn" data-act="save-settings">บันทึกชื่อร้าน</button></div>
  </div></div>
  <div class="panel section-gap" style="max-width:620px"><h3>ข้อมูลในระบบ</h3><div class="pad" style="display:grid;gap:12px">
    <p class="hint" style="margin:0">ตอนนี้มีสินค้า ${S.products.length} รายการ, ลูกค้า ${S.customers.length} ราย, บิลขาย ${S.sales.length} ใบ, ใบสั่งซื้อ ${S.purchases.length} ใบ</p>
    <div class="actions"><button class="btn ghost" data-act="export">สำรองข้อมูล (.json)</button><button class="btn ghost" data-act="import">นำเข้าไฟล์สำรอง</button></div>
    <p class="hint" style="margin:0">ข้อมูลเก็บไว้ในเบราว์เซอร์ของเครื่องนี้ ถ้าล้างประวัติเบราว์เซอร์หรือเปลี่ยนเครื่อง ข้อมูลจะไม่ตามไปด้วย แนะนำให้กดสำรองไว้เป็นระยะ</p>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="actions"><button class="btn ghost" data-act="load-sample">แทนที่ด้วยข้อมูลตัวอย่าง</button><button class="btn danger" data-act="clear-all">ลบข้อมูลทั้งหมด</button></div>
  </div></div>`;
}
};

function docList(kind){
  const isSale = kind === 'sale';
  const key = isSale ? 'sales' : 'purchases';
  const list = sortDesc(S[key]);
  const partyList = isSale ? S.customers : S.suppliers;
  const pk = isSale ? 'customerId' : 'supplierId';
  const rows = list.filter(d => match(key, d.no, byId(partyList, d[pk])?.name));
  const paid = isSale ? salePaid : purPaid;
  return head(key, `<button class="btn" data-act="new-${kind}">${icon('plus')}${isSale?'ออกบิลขาย':'สร้างใบสั่งซื้อ'}</button>`) + `
  <div class="panel"><div class="toolbar">${searchBox(key, 'ค้นหาเลขที่หรือชื่อ...')}</div>
  <div id="list">${tbl([
    {h:'เลขที่',f:d=>`<button class="link" data-act="view-${kind}" data-id="${d.id}">${d.no}</button>`},
    {h:'วันที่',f:d=>thDate(d.date)},
    {h:isSale?'ลูกค้า':'ผู้ผลิต',f:d=>esc(byId(partyList,d[pk])?.name||'-')},
    {h:'รายการ',c:'num',f:d=>d.items.length},
    {h:'ยอดรวม',c:'num',f:d=>money(docTotal(d))},
    {h:'สถานะ',f:d=>payTag(docTotal(d),paid(d))},
    {h:'',c:'act',f:d=>`<button class="icon-btn del" data-act="del-${kind}" data-id="${d.id}" aria-label="ยกเลิก">${icon('trash')}</button>`}
  ], rows, list.length ? 'ไม่เจอที่ค้นหา' : (isSale?'ยังไม่มีบิลขาย':'ยังไม่มีใบสั่งซื้อ'))}</div></div>`;
}

function payPage(kind){
  const isR = kind === 'receipt';
  const docs = isR ? S.sales : S.purchases;
  const due = isR ? saleDue : purDue;
  const partyList = isR ? S.customers : S.suppliers;
  const pk = isR ? 'customerId' : 'supplierId';
  const key = isR ? 'receipts' : 'payments';
  const open = sortDesc(docs.filter(d => due(d) > 0)).reverse().filter(d => match(key, d.no, byId(partyList,d[pk])?.name, byId(partyList,d[pk])?.code));
  const hist = sortDesc(S[key]).slice(0, 50);
  return head(key) + `
  <div class="panel"><h3>${isR?'บิลที่ลูกค้ายังค้างชำระ':'ใบสั่งซื้อที่เรายังค้างจ่าย'}</h3>
  <div class="toolbar" style="border-bottom:0">${searchBox(key, isR?'ค้นหาเลขบิล รหัส หรือชื่อลูกค้า...':'ค้นหาเลขที่หรือชื่อผู้ผลิต...')}</div>
  <div id="list">${tbl([
    {h:'เลขที่',f:d=>`<button class="link" data-act="view-${isR?'sale':'purchase'}" data-id="${d.id}">${d.no}</button>`},
    {h:'วันที่',f:d=>thDate(d.date)},
    {h:isR?'รหัสลูกค้า':'รหัส',f:d=>`<span class="code">${esc(byId(partyList,d[pk])?.code||'-')}</span>`},
    {h:isR?'ชื่อลูกค้า':'ผู้ผลิต',f:d=>esc(byId(partyList,d[pk])?.name||'-')},
    {h:'ยอดรวม',c:'num',f:d=>money(docTotal(d))},
    {h:'คงค้าง',c:'num',f:d=>`<b>${money(due(d))}</b>`},
    {h:'',c:'act',f:d=>`<button class="btn sm" data-act="${isR?'receive':'pay'}" data-id="${d.id}">${icon('cash')}${isR?'รับเงิน':'จ่ายเงิน'}</button>`}
  ], open, isR?'ไม่มีบิลค้าง เก็บเงินครบหมดแล้ว':'ไม่มียอดค้างจ่าย')}</div></div>
  <div class="panel section-gap"><h3>${isR?'ประวัติการรับเงิน':'ประวัติการจ่ายเงิน'}</h3><div class="pad" style="padding-top:10px">${tbl([
    {h:'เลขที่',f:r=>`<span class="code">${r.no}</span>`},
    {h:'วันที่',f:r=>thDate(r.date)},
    {h:isR?'บิลขาย':'ใบสั่งซื้อ',f:r=>esc(byId(docs, isR?r.saleId:r.purchaseId)?.no||'-')},
    {h:isR?'ลูกค้า':'ผู้ผลิต',f:r=>{const d=byId(docs,isR?r.saleId:r.purchaseId);return esc(d?byId(partyList,d[pk])?.name:'-')}},
    {h:'ช่องทาง',f:r=>esc(r.method)},
    {h:'จำนวนเงิน',c:'num',f:r=>money(r.amount)},
    {h:'',c:'act',f:r=>`<button class="icon-btn del" data-act="del-${kind}" data-id="${r.id}" aria-label="ลบ">${icon('trash')}</button>`}
  ], hist, 'ยังไม่มีรายการ')}</div></div>`;
}

/* ---------- modal ---------- */
let onSave = null;
function openModal(title, body, saveFn, saveLabel='บันทึก', wide=false, extraBtns=''){
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = body + '<div class="err" id="mErr"></div>';

/* ---------- sample data ---------- */
function loadSample(){
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const st = emptyState(); st.shop = S.shop && S.shop !== 'คลังสินค้าของฉัน' ? S.shop : 'คลังสินค้าตัวอย่าง';
  const prods = [['น้ำดื่ม 600 มล.','แพ็ค',42,55,6],['ข้าวหอมมะลิ 5 กก.','ถุง',165,199,8],['น้ำมันพืช 1 ลิตร','ขวด',48,58,10],['น้ำตาลทราย 1 กก.','ถุง',24,30,10],
    ['ไข่ไก่ เบอร์ 2','แผง',102,125,6],['บะหมี่กึ่งสำเร็จรูป','ลัง',168,195,4],['สบู่ก้อน แพ็ค 4','แพ็ค',46,59,6],['ผงซักฟอก 900 ก.','ถุง',72,89,6]];
  st.products = prods.map((p,i) => ({id:uid(), code:'P'+String(i+1).padStart(3,'0'), name:p[0], unit:p[1], cost:p[2], price:p[3], qty:0, min:p[4]}));
  st.suppliers = [['บ.สยามค้าส่ง จำกัด','02-123-4567'],['หจก.ไทยรุ่งเรืองฟู้ด','081-234-5678'],['ร้านใจดีขายส่ง','089-876-5432']].map((s,i) => ({id:uid(), code:'S'+String(i+1).padStart(3,'0'), name:s[0], phone:s[1], note:''}));
  st.customers = [['ร้านป้าแดง มินิมาร์ท','086-111-2233'],['ก๋วยเตี๋ยวเจ๊หมวย','092-444-5566'],['หอพักบ้านสวน','081-777-8899'],['คุณสมชาย ใจเย็น','095-222-3344'],['ร้านข้าวแกงลุงเปี๊ยก','087-555-6677'],['โรงเรียนอนุบาลดาวน้อย','02-987-6543']]
    .map((c,i) => ({id:uid(), code:'C'+String(45480+i*3).padStart(5,'0'), name:c[0], phone:c[1], note:''}));
  const today = localToday(); const now = new Date();
  const dateIn = (off, day) => { const x = new Date(now.getFullYear(), now.getMonth()-off, day); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); const s = x.toISOString().slice(0,10); return s > today ? today : s; };
  let po = 0, so = 0, rc = 0, pv = 0;
  for(let off=5; off>=0; off--){
    const pItems = st.products.map(p => ({productId:p.id, qty: 30 + Math.floor(rnd()*30), price:p.cost}));
    const pd = {id:uid(), no:'PO-'+String(++po).padStart(4,'0'), date:dateIn(off,2), supplierId:pick(st.suppliers).id, items:pItems, note:''};
    pItems.forEach(i => byId(st.products,i.productId).qty += i.qty);
    st.purchases.push(pd);
    if(off >= 1) st.payments.push({id:uid(), no:'PV-'+String(++pv).padStart(4,'0'), date:dateIn(off,20), purchaseId:pd.id, amount:docTotal(pd), method:'โอนเงิน', note:''});
    else if(rnd() > .3){ st.payments.push({id:uid(), no:'PV-'+String(++pv).padStart(4,'0'), date:dateIn(0,Math.min(now.getDate(),5)), purchaseId:pd.id, amount:Math.round(docTotal(pd)*.4), method:'โอนเงิน', note:'มัดจำ'}); }
    const nSales = off === 0 ? Math.max(3, Math.min(8, now.getDate()/3|0)) : 7 + Math.floor(rnd()*5);
    const lastDay = off === 0 ? now.getDate() : 28;
    for(let k=0; k<nSales; k++){
      const items = []; const used = new Set();
      const n = 1 + Math.floor(rnd()*3);
      for(let j=0;j<n;j++){ const p = pick(st.products); if(used.has(p.id)) continue; used.add(p.id); const q = Math.min(p.qty, 2 + Math.floor(rnd()*7)); if(q>0){ items.push({productId:p.id, qty:q, price:p.price, cost:p.cost}); p.qty -= q; } }
      if(!items.length) continue;
      const day = Math.max(1, Math.min(lastDay, 3 + Math.floor(rnd()*(lastDay-2))));
      const s = {id:uid(), no:'SO-'+String(++so).padStart(4,'0'), date:dateIn(off,day), customerId:pick(st.customers).id, items, note:''};
      st.sales.push(s);
      const r = rnd(); const t = docTotal(s);
      const payAmt = off >= 2 ? t : off === 1 ? (r > .35 ? t : r > .15 ? Math.round(t/2) : 0) : (r > .6 ? t : r > .4 ? Math.round(t/2) : 0);
      if(payAmt > 0) st.receipts.push({id:uid(), no:'RC-'+String(++rc).padStart(4,'0'), date:s.date, saleId:s.id, amount:payAmt, method: rnd() > .5 ? 'เงินสด' : 'โอนเงิน', note:''});
    }
  }
  st.sales.sort((a,b) => a.date.localeCompare(b.date)).forEach((s,i) => s.no = 'SO-'+String(i+1).padStart(4,'0'));
  // leave a couple of items low
  st.products[4].qty = 3; st.products[1].qty = Math.min(st.products[1].qty, 5);
  S = st; save(); current = 'dashboard'; render(); toast('โหลดข้อมูลตัวอย่างแล้ว ลองกดดูแต่ละเมนูได้เลย');
}

/* ---------- events ---------- */
function closeMenu(){ document.body.classList.remove('menu-open'); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'nav': current = b.dataset.k; closeMenu(); render(); window.scrollTo(0,0); break;
    case 'open-menu': document.body.classList.add('menu-open'); break;
    case 'close-menu': closeMenu(); break;
    case 'close': closeModal(); break;
    case 'm-save': if(onSave && onSave() !== false) closeModal(); break;
    case 'add-product': entForm('product'); break; case 'edit-product': entForm('product', id); break; case 'del-product': entDelete('product', id); break;
    case 'add-supplier': entForm('supplier'); break; case 'edit-supplier': entForm('supplier', id); break; case 'del-supplier': entDelete('supplier', id); break;
    case 'add-customer': entForm('customer'); break; case 'edit-customer': entForm('customer', id); break; case 'del-customer': entDelete('customer', id); break;
    case 'new-sale': docForm('sale'); break; case 'new-purchase': docForm('purchase'); break;
    case 'view-sale': viewDoc('sale', id); break; case 'view-purchase': viewDoc('purchase', id); break;
    case 'del-sale': docDelete('sale', id); break; case 'del-purchase': docDelete('purchase', id); break;
    case 'add-line': addLine(); break;
    case 'rm-line': if(document.querySelectorAll('#lines .line').length > 1){ b.closest('.line').remove(); recalc(); } break;
    case 'receive': moneyForm('receipt', id); break; case 'pay': moneyForm('payment', id); break;
    case 'del-receipt': moneyDelete('receipt', id); break; case 'del-payment': moneyDelete('payment', id); break;
    case 'load-sample':
      if(S.products.length || S.sales.length) confirmBox('ข้อมูลที่มีอยู่ตอนนี้จะถูกแทนที่ด้วยข้อมูลตัวอย่างทั้งหมด', loadSample, 'แทนที่');
      else loadSample(); break;
    case 'clear-all': confirmBox('ลบข้อมูลทุกอย่างในระบบ กู้คืนไม่ได้นะ', () => { const shop = S.shop; S = emptyState(); S.shop = shop; save(); render(); toast('ล้างข้อมูลแล้ว'); }, 'ลบทั้งหมด'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'warehouse-backup-' + localToday() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('ดาวน์โหลดไฟล์สำรองแล้ว'); break; }
    case 'import': $('#importFile').click(); break;
    case 'save-settings': S.shop = $('#setShop').value.trim() || 'คลังสินค้าของฉัน'; save(); render(); toast('บันทึกชื่อร้านแล้ว'); break;
  }
});
document.addEventListener('input', e => {
  const s = e.target.dataset.search;
  if(s){ Q[s] = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector(`[data-search="${s}"]`); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(e.target.closest('#lines')) recalc();
});
document.addEventListener('change', e => {
  if(e.target.id === 'importFile' && e.target.files[0]){
    const f = e.target.files[0]; const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if(!Array.isArray(d.products) || !Array.isArray(d.sales)) throw 0;
      confirmBox('ข้อมูลตอนนี้จะถูกแทนที่ด้วยไฟล์ที่เลือก', () => { S = Object.assign(emptyState(), d); save(); render(); toast('นำเข้าข้อมูลแล้ว'); }, 'นำเข้า');
    } catch(_) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ'); } };
    rd.readAsText(f); e.target.value = ''; return;
  }
  if(e.target.classList.contains('lp')){ setLinePrice(e.target.closest('.line')); recalc(); }
  if(e.target.dataset.rep === 'month'){ Q.repMonth = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!$('#modal').hidden) closeModal(); else closeMenu(); }
  if(e.key === 'Enter' && !$('#modal').hidden && e.target.tagName === 'INPUT' && onSave){ e.preventDefault(); if(onSave() !== false) closeModal(); }
});
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

render();
connectDB();
</script>
</body>
</html>
