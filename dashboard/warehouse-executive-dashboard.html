if(view==='overview'){title('Executive Overview');body=`<div class="kpis">${card('มูลค่าสต็อกล่าสุด',money(s.value),'ยอดรวมวันล่าสุดราย SKU','#3de0de','◆')}${card('ปริมาณคงเหลือ',n(s.stock)+' ชิ้น',`${n(s.sku)} SKU ในตัวกรอง`,'#a18bfa','▦')}${card('อัตราจ่ายได้ (Fill Rate)',pct(s.fill),`${n(s.issues)} / ${n(s.requested)} ชิ้น`,'#47d9ab','◉')}${card('รายการต่ำกว่า Safety Stock',n(s.low)+' SKU',`สินค้าหมด ${n(s.zero)} SKU`,'#fb7987','⚑')}</div><div class="grid">${panel('มูลค่าสต็อกรายวัน',canvas('valuechart'),8,'Daily trend')}${panel('สัดส่วนมูลค่าสต็อกตามหมวดหมู่',canvas('categorychart'),4,'Category')}${panel('ยอดร้องขอเทียบกับยอดจ่าย',canvas('demandchart'),7,'Daily units')}${panel('Executive Insights',`<div class="insight">อัตราจ่ายสินค้า <b>${pct(s.fill)}</b><br>ความต้องการที่ยังไม่ได้รับการจ่าย <b>${n(s.unfilled)}</b> ชิ้น<br>SKU ต่ำกว่า Safety Stock <b>${n(s.low)}</b> รายการ จาก ${n(s.sku)} รายการ<br><br><b>ข้อเสนอแนะ:</b> ${s.low?'ตรวจสอบรายการเสี่ยงขาดสต็อกในเมนู Smart Alerts และทบทวนแผนเติมสินค้า':'สต็อกทุกรายการอยู่ที่หรือสูงกว่า Safety Stock ในช่วงล่าสุด'}</div>`,5)}${panel('สินค้าเสี่ยงขาดสต็อก',inventoryTable(alerts.filter(x=>x.Closing_units<x.SafetyStock_units).slice(0,8)),12,'Top risks')}</div>`;charts=[['valuechart','line',d.map(x=>({label:x.date.slice(5),value:x.value}))],['categorychart','donut',c.map(x=>({label:x.name,value:x.value}))],['demandchart','bars2',d.map(x=>({label:x.date.slice(5),value:x.requested,other:x.issue}))]]}
else if(view==='inventory'){title('Inventory Analysis');body=`<div class="kpis">${card('มูลค่าสต็อก',money(s.value),'มูลค่าคงเหลือล่าสุด','#3de0de','◆')}${card('สินค้าคงเหลือ',n(s.stock),'จำนวนชิ้นทั้งหมด','#a18bfa','▦')}${card('SKU ที่ติดตาม',n(s.sku),'จำนวนรหัสสินค้า','#47d9ab','◈')}${card('ต่ำกว่า Safety Stock',n(s.low),'ต้องเฝ้าระวัง','#fb7987','⚑')}</div><div class="grid">${panel('มูลค่าสต็อกตามเวลา',canvas('valuechart'),8)}${panel('มูลค่าตามหมวดหมู่',canvas('categorychart'),4)}${panel('ทะเบียนสินค้า (ยอดคงเหลือล่าสุดของแต่ละ SKU)',inventoryTable(latest.slice().sort((a,b)=>b.ClosingValue_THB-a.ClosingValue_THB)),12)}</div>`;charts=[['valuechart','line',d.map(x=>({label:x.date.slice(5),value:x.value}))],['categorychart','donut',c.map(x=>({label:x.name,value:x.value}))]]}
else if(view==='demand'){title('Demand & Fulfillment');body=`<div class="kpis">${card('จำนวนร้องขอ',n(s.requested),'หน่วย: ชิ้น','#a18bfa','↗')}${card('จำนวนจ่ายสำเร็จ',n(s.issues),'หน่วย: ชิ้น','#3de0de','✓')}${card('จำนวนค้างจ่าย',n(s.unfilled),'หน่วย: ชิ้น','#fb7987','!')}${card('Fill Rate',pct(s.fill),'จ่ายจริง ÷ ร้องขอ','#47d9ab','◉')}</div><div class="grid">${panel('แนวโน้ม Requested vs Issue',canvas('demandchart'),8)}${panel('ยอดค้างจ่ายรายวัน',canvas('unfilledchart'),4)}${panel('คำอธิบายตัวชี้วัด',`<div class="insight">Fill Rate = Issue_units ÷ Requested_units × 100<br>Unfilled = Requested_units − Issue_units (เมื่อบันทึกข้อมูลสอดคล้องกัน)<br>ใช้ผลรวมยอดร้องขอและยอดจ่ายตลอดช่วงวันที่ที่เลือก ไม่ใช่ยอด ณ วันล่าสุด</div>`,12)}</div>`;charts=[['demandchart','bars2',d.map(x=>({label:x.date.slice(5),value:x.requested,other:x.issue}))],['unfilledchart','bar',d.map(x=>({label:x.date.slice(5),value:x.unfilled}))]]}
else if(view==='alerts'){title('Smart Alerts & Reorder');let critical=alerts.filter(x=>x.Closing_units===0),below=alerts.filter(x=>x.Closing_units<x.SafetyStock_units),order=alerts.filter(x=>x.suggested>0);body=`<div class="kpis">${card('Out of Stock',n(critical.length)+' SKU','ไม่มีสินค้าคงเหลือ','#fb7987','!')}${card('Below Safety',n(below.length)+' SKU','ต่ำกว่าระดับปลอดภัย','#f8b867','⚑')}${card('Reorder Needed',n(order.length)+' SKU','ต่ำกว่า ROP ที่คำนวณ','#a18bfa','↻')}${card('Suggested Order',n(sum(order,'suggested'))+' ชิ้น','ปริมาณแนะนำเบื้องต้น','#3de0de','▦')}</div><div class="grid">${panel('คำแนะนำในการแก้ไข',`<div class="insight"><b>วิกฤต (คงเหลือ = 0):</b> ตรวจสอบคำสั่งซื้อและวันรับของ ประสานฝ่ายจัดซื้อเพื่อเร่งเติมสินค้า<br><b>ต่ำกว่า Safety Stock:</b> ตรวจสอบการใช้จริงและ Lead Time ปรับลำดับการสั่งซื้อ<br><b>สูตร ROP:</b> Safety Stock + (อัตราจ่ายเฉลี่ยต่อวัน × Lead Time) โดยใช้อัตราจ่ายเฉลี่ยในวันของช่วงที่เลือก<br><b>Suggested Order:</b> max(0, ROP − Closing Stock) เป็นแนวทางเบื้องต้น ไม่รวมสินค้าระหว่างสั่งซื้อ (On Order) และ MOQ</div>`,12)}${panel('รายการแจ้งเตือนและข้อเสนอปริมาณสั่งซื้อ',inventoryTable(alerts.filter(x=>x.suggested>0||x.Closing_units<x.SafetyStock_units),'order'),12,'Calculated')}</div>`}
else if(view==='abc'){title('ABC / Pareto Analysis');let abc=aggregate(filtered).map(x=>({...x,value:x.Issue_units*x.UnitCost_THB})).sort((a,b)=>b.value-a.value),tot=sum(abc,'value'),running=0;abc=abc.map(x=>{running+=x.value;let pc=tot?100*running/tot:0;return {...x,pc,cl:pc<=80?'A':pc<=95?'B':'C'}});let count={A:abc.filter(x=>x.cl==='A').length,B:abc.filter(x=>x.cl==='B').length,C:abc.filter(x=>x.cl==='C').length};body=`<div class="kpis">${card('มูลค่าการจ่าย',money(tot),'Issue × Unit Cost','#3de0de','◆')}${card('Class A',n(count.A)+' SKU','ยอดสะสมไม่เกิน 80%','#fb7987','A')}${card('Class B',n(count.B)+' SKU','ยอดสะสม 80–95%','#f8b867','B')}${card('Class C',n(count.C)+' SKU','ยอดสะสมมากกว่า 95%','#47d9ab','C')}</div><div class="grid">${panel('Pareto: มูลค่าการจ่ายสะสมตาม SKU',canvas('paretochart'),12,'Issue value')}${panel('ABC Classification',`<p class="subhead">จัดอันดับตามมูลค่าการจ่ายสะสมในช่วงวันที่เลือก เกณฑ์ A ≤ 80%, B ≤ 95%, C > 95%</p><div class="tablewrap"><table class="tbl"><thead><tr><th>อันดับ</th><th>SKU</th><th>สินค้า</th><th>มูลค่าจ่าย (บาท)</th><th>สะสม (%)</th><th>Class</th></tr></thead><tbody>${abc.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.SKU)}</td><td>${esc(x.ProductName)}</td><td>${n(x.value)}</td><td>${pct(x.pc)}</td><td><span class="pill ${x.cl==='A'?'danger':x.cl==='B'?'warn':'ok'}">${x.cl}</span></td></tr>`).join('')}</tbody></table></div>`,12)}</div>`;charts=[['paretochart','pareto',abc.map(x=>({label:x.SKU,value:x.value,pc:x.pc}))]]}
else {title('Data Explorer');body=`<div class="grid">${panel('ข้อมูลรายวันทั้งหมด',`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 15px"><input class="search" id="search" placeholder="ค้นหารหัส / ชื่อสินค้า" oninput="filterDataTable()"><span class="subtitle">แสดงได้สูงสุด 300 แถว • ใช้ Export CSV เพื่อดูทั้งหมด</span></div><div id="explorertable"></div>`,12,'CSV records')}</div>`}
el('content').innerHTML=body;if(view==='data')filterDataTable();requestAnimationFrame(()=>charts.forEach(([id,type,data])=>draw(id,type,data)))}
function filterDataTable(){let inp=el('search'),q=(inp?.value||'').toLowerCase(),rows=filtered.filter(x=>x.SKU.toLowerCase().includes(q)||x.ProductName.toLowerCase().includes(q)).slice(0,300);el('explorertable').innerHTML=`<div class="tablewrap"><table class="tbl"><thead><tr>${expected.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${expected.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function draw(id,type,data){const cv=el(id);if(!cv)return;let w=cv.clientWidth,h=cv.clientHeight;if(w<2)return;let ratio=Math.min(devicePixelRatio||1,2);cv.width=w*ratio;cv.height=h*ratio;let ctx=cv.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);let colors=['#3de0de','#a18bfa','#47d9ab','#f8b867','#fb7987','#6fa0fc'];ctx.font='10px Prompt, sans-serif';if(!data.length||data.every(d=>!d.value)){ctx.fillStyle='#93a6bf';ctx.textAlign='center';ctx.fillText('ไม่มีข้อมูลสำหรับแสดงกราฟ',w/2,h/2);return}if(type==='donut'){const total=data.reduce((s,d)=>s+d.value,0),cx=w*.45,cy=h*.49,r=Math.min(w*.27,h*.37),ring=r*.34;let a=-Math.PI/2;data.forEach((d,i)=>{let b=a+d.value/total*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,a,b);ctx.arc(cx,cy,r-ring,b,a,true);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();a=b});ctx.textAlign='center';ctx.fillStyle='#eaf6ff';ctx.font='600 14px Prompt';ctx.fillText('100%',cx,cy+5);data.slice(0,6).forEach((d,i)=>{let x=w*.76,y=25+i*24;ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,y,7,7);ctx.fillStyle='#aabbd2';ctx.textAlign='left';ctx.font='10px Prompt';ctx.fillText(d.name||d.label,x+12,y+7,Math.max(20,w*.22))});return}
let L=55,R=16,T=14,B=34,pw=w-L-R,ph=h-T-B,max=Math.max(...data.map(d=>Math.max(d.value,d.other||0)),1)*1.12;function y(v){return T+ph-(v/max)*ph}ctx.strokeStyle='#263652';ctx.lineWidth=1;ctx.fillStyle='#91a6c2';for(let i=0;i<=4;i++){let yy=T+ph*i/4;ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke();ctx.textAlign='right';ctx.fillText(n(max*(1-i/4),0),L-7,yy+3)}let step=pw/Math.max(1,data.length),labels=data.length>18?Math.ceil(data.length/9):1;for(let i=0;i<data.length;i+=labels){ctx.textAlign='center';ctx.fillText(data[i].label,L+step*(i+.5),h-10)}if(type==='bar'||type==='bars2'||type==='pareto'){let bw=Math.min(22,step*(type==='bars2'?.32:.65));data.forEach((d,i)=>{let x=L+step*(i+.5);ctx.fillStyle=colors[0];ctx.fillRect(x-(type==='bars2'?bw: bw/2),y(d.value),bw,T+ph-y(d.value));if(type==='bars2'){ctx.fillStyle=colors[1];ctx.fillRect(x+2,y(d.other||0),bw,T+ph-y(d.other||0))}})}if(type==='line'){ctx.strokeStyle=colors[0];ctx.lineWidth=2;ctx.beginPath();data.forEach((d,i)=>{let x=L+step*(i+.5);i?ctx.lineTo(x,y(d.value)):ctx.moveTo(x,y(d.value))});ctx.stroke();data.forEach((d,i)=>{if(i%Math.ceil(data.length/35)===0){ctx.beginPath();ctx.arc(L+step*(i+.5),y(d.value),2,0,Math.PI*2);ctx.fillStyle=colors[0];ctx.fill()}})}if(type==='pareto'){let maxpc=100;ctx.strokeStyle=colors[1];ctx.lineWidth=2;ctx.beginPath();data.forEach((d,i)=>{let x=L+step*(i+.5),yy=T+ph-(d.pc/maxpc)*ph;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();ctx.fillStyle=colors[1];ctx.textAlign='right';ctx.fillText('100%',w-1,T+9)}}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('เครื่องหมายอัญประกาศใน CSV ไม่สมบูรณ์');if(field!==''||row.length){row.push(field);rows.push(row)}let head=rows.shift()?.map(x=>x.trim())||[],missing=expected.filter(x=>!head.includes(x));if(missing.length)throw Error('ไม่มีคอลัมน์ที่จำเป็น: '+missing.join(', '));let result=[],seen=new Set;for(let j=0;j<rows.length;j++){let vals=rows[j];if(vals.length!==head.length)throw Error('แถว '+(j+2)+' จำนวนคอลัมน์ไม่ตรง');let o={};head.forEach((k,i)=>o[k]=vals[i].trim());let dt=o.Date;if(/^\d{4}-\d{2}-\d{2}$/.test(dt)){let [yy,mm,dd]=dt.split('-').map(Number);if(new Date(Date.UTC(yy,mm-1,dd)).toISOString().slice(0,10)!==dt)throw Error('วันที่ไม่ถูกต้อง แถว '+(j+2))}else if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dt)){let [mm,dd,yy]=dt.split('/').map(Number);let z=new Date(Date.UTC(yy,mm-1,dd));if(z.getUTCFullYear()!==yy||z.getUTCMonth()!==mm-1||z.getUTCDate()!==dd)throw Error('วันที่ไม่ถูกต้อง แถว '+(j+2));dt=z.toISOString().slice(0,10)}else throw Error('รูปแบบวันที่ไม่รองรับ แถว '+(j+2));o.Date=dt;if(!o.SKU||!o.ProductName)throw Error('SKU/ชื่อสินค้าว่าง แถว '+(j+2));let key=o.SKU+'|'+o.Date;if(seen.has(key))throw Error('พบ SKU + Date ซ้ำ แถว '+(j+2));seen.add(key);for(let k of numeric){if(o[k]===''||!Number.isFinite(+o[k])||+o[k]<0)throw Error('ตัวเลขไม่ถูกต้อง '+k+' แถว '+(j+2));o[k]=+o[k]}if(o.Opening_units+o.Receipt_units-o.Issue_units!==o.Closing_units)throw Error('สมการสต็อกไม่สอดคล้อง แถว '+(j+2));if(o.Requested_units-o.Issue_units!==o.Unfilled_units)throw Error('ยอด Unfilled ไม่สอดคล้อง แถว '+(j+2));if(Math.abs(o.Closing_units*o.UnitCost_THB-o.ClosingValue_THB)>0.01)throw Error('มูลค่าสต็อกไม่สอดคล้อง แถว '+(j+2));result.push(o)}if(!result.length)throw Error('ไม่มีข้อมูล');return result}
function exportCSV(){let data=[expected.join(','),...filtered.map(r=>expected.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let blob=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='warehouse_filtered_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
el('toggle').onclick=()=>{if(innerWidth<=760){el('sidebar').classList.toggle('open');el('overlay').classList.toggle('show')}else el('app').classList.toggle('collapsed');setTimeout(()=>charts.forEach(([id,t,d])=>draw(id,t,d)),280)};el('overlay').onclick=()=>{el('sidebar').classList.remove('open');el('overlay').classList.remove('show')};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));el('sidebar').classList.remove('open');el('overlay').classList.remove('show');render()});['start','end','category'].forEach(id=>el(id).addEventListener('change',recalc));el('reset').onclick=()=>{settings();recalc()};el('load').onclick=()=>el('csvfile').click();el('csvfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let next=parseCSV(await f.text());all=next;settings();recalc();alert('นำเข้าสำเร็จ '+n(all.length)+' แถว')}catch(err){alert('นำเข้าไม่สำเร็จ: '+err.message)}finally{e.target.value=''}};el('export').onclick=exportCSV;window.addEventListener('resize',()=>charts.forEach(([id,t,d])=>draw(id,t,d)));settings();recalc();
</script></body></html>
